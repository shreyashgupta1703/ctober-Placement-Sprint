<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1000px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px}h1{font-size:30px;margin:0 0 5px}.sub{color:var(--muted);font-size:13px}.overall{text-align:right}.overall strong{font-size:27px}.overall span{display:block;color:var(--muted);font-size:11px}
.progress{height:8px;background:#ddd;border-radius:20px;margin:7px 0 0;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:7px;cursor:pointer}.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}#search{margin-left:auto;border:1px solid var(--line);border-radius:7px;padding:8px 11px;min-width:210px;background:white}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:13px;overflow:hidden}.day.today{border:2px solid var(--accent)}.day.half{background:#fffdf5}.dayhead{display:grid;grid-template-columns:90px 1fr 100px;align-items:center;gap:14px;padding:13px 15px;background:#fafaf8;border-bottom:1px solid var(--line)}.daynum{font-size:20px;font-weight:700}.date{font-size:11px;color:var(--muted);margin-top:2px}.focus{font-size:12px;font-weight:700}.badge{text-align:right;font-size:10px;color:var(--muted)}.badge.today{color:var(--accent)}.badge.half{color:#9b7410}
.tasks{padding:5px 15px}.task{display:grid;grid-template-columns:25px 105px 1fr 70px;align-items:center;gap:8px;min-height:43px;border-bottom:1px solid #eee;padding:6px 0}.task:last-child{border-bottom:0}.task input{appearance:none;width:17px;height:17px;border:1.5px solid #999;border-radius:4px;cursor:pointer}.task input:checked{background:var(--accent);border-color:var(--accent)}.task input:checked:after{content:"✓";color:#fff;display:block;text-align:center;font-size:12px;font-weight:bold}.task.checked .name{text-decoration:line-through;color:#999}.time{font-size:11px;color:var(--muted)}.name{font-size:13px}.type{font-size:9px;text-align:right;color:var(--muted);text-transform:uppercase}.dsa .type{color:#476f9c}.project .type{color:var(--accent)}.core .type{color:#a16c1e}.sql .type{color:#795a9d}.note{font-size:11px;color:var(--muted);padding:7px 0 10px;margin-left:25px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:20px}.stat{background:white;border:1px solid var(--line);border-radius:9px;padding:12px}.stat b{font-size:19px}.stat span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
@media(max-width:650px){header{display:block}.overall{text-align:left;margin-top:14px}.summary{grid-template-columns:repeat(2,1fr)}.dayhead{grid-template-columns:70px 1fr}.badge{display:none}.task{grid-template-columns:25px 72px 1fr}.type{display:none}#search{width:100%;margin-left:0}}

</header>

16:{focus:"DSA maintenance + POTD",dsa:[["08:30–10:00","Mixed DSA"],["10:00–11:30","Weak topics"],["11:30–12:00","POTD"],["12:00–12:30","SQL50"]],project:[["13:30–15:30","Deep Packet Inspection — architecture"],["15:30–17:30","Packet flow + protocol basics"]],core:[["18:30–20:15","HLD — load balancing + scaling"],["20:15–22:00","Replication / consistency"]]},

let mode="all", state=JSON.parse(localStorage.getItem("october-placement-checklist")||"{}");
function allTasks(){let a=[];for(let d=1;d<=31;d++){let p=plan[d];if(!p)continue;["dsa","project","core"].forEach(k=>(p[k]||[]).forEach((t,i)=>a.push({id:`${d}-${k}-${i}`,d,k,time:t[0],name:t[1]})));if(!half.has(d))a.push({id:`${d}-sql`,d,k:"sql",time:"Daily",name:"SQL — 30 min"});else a.push({id:`${d}-half`,d,k:"half",time:"Day",name:"Half-day reset — NO DSA"});}return a}
function render(){let q=document.getElementById("search").value.toLowerCase(),days=document.getElementById("days");days.innerHTML="";let all=allTasks(),done=all.filter(x=>state[x.id]).length,p=Math.round(done/all.length*100);document.getElementById("done").textContent=done;document.getElementById("left").textContent=all.length-done;document.getElementById("pct").textContent=p+"%";document.getElementById("bar").style.width=p+"%";
for(let d=1;d<=31;d++){let p=plan[d];if(!p)continue;let tasks=all.filter(x=>x.d===d).filter(x=>(mode==="all"||mode==="half"&&half.has(d)||mode==="dsa"&&x.k==="dsa"||mode==="projects"&&x.k==="project"||mode==="core"&&(x.k==="core"||x.k==="sql"))&&(!q||(x.name+" "+p.focus).toLowerCase().includes(q)));if(!tasks.length)continue;let today=new Date().getFullYear()===2026&&new Date().getMonth()===9&&new Date().getDate()===d;let el=document.createElement("section");el.className="day "+(today?"today ":"")+(half.has(d)?"half":"");let weekday=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(2026,9,d).getDay()];el.innerHTML=`<div class="dayhead"><div><div class="daynum">Day ${d}</div><div class="date">October ${d}, 2026 · ${weekday}</div></div><div class="focus">${p.focus}</div><div class="badge ${today?"today":half.has(d)?"half":""}">${today?"TODAY":half.has(d)?"HALF DAY":"CHECKLIST"}</div></div><div class="tasks"></div>`;let box=el.querySelector(".tasks");tasks.forEach(x=>{let row=document.createElement("div");row.className=`task ${x.k} ${state[x.id]?"checked":""}`;row.innerHTML=`<input type="checkbox" ${state[x.id]?"checked":""}><span class="time">${x.time}</span><span class="name">${x.name}</span><span class="type">${x.k==="project"?"PROJECT":x.k==="core"?"CORE":x.k==="sql"?"SQL":x.k==="half"?"RESET":"DSA"}</span>`;row.querySelector("input").onchange=e=>{state[x.id]=e.target.checked;localStorage.setItem("october-placement-checklist",JSON.stringify(state));render()};box.appendChild(row)});days.appendChild(el)}}
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.filter;render()});document.getElementById("search").oninput=render;render();
</script>
</body>
